<!DOCTYPE html>
<html>
    <head>
        <title>
            weather-app
        </title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
        
    </head>
    <body>
        <div class="container">
            <div class="weather-app">
                <div class="heading">
                    Weather Application
                </div>
                <div class="input-field">
                    <input type="text" placeholder="Enter place" spellcheck=false>
                    <button><img src="images/search.png"></button>
                </div>
                <div class="weather-info hidden">
                    <div class="primary-info">
                        <img src="images/clear.png" class="weather-img">
                        <h1 class="temp">22°C</h1>
                        <h2 class="name">New York</h2>
                    </div>
                    <div class="additional-info">
                        <div class="humidity">
                            <div>
                                <img src="images/humidity.png">
                            </div>
                            <div>    
                                <p class="humidity-percentage">64%</p>
                                <p class="humidity-text">Humidity</p>
                            </div>
                        </div>
                        <div class="wind">
                            <div>
                                <img src="images/wind.png">
                            </div>
                            <div>   
                                <p class="wind-speed">16 km/h</p> 
                                <p class="wind-text">Wind</p>
                            </div>
                        </div>    
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
